<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ambient Radial Glow -->
    <radialGradient id="pm-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Vault Shield Gradient -->
    <linearGradient id="pm-shield-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="50%" stop-color="#080c17"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>

    <!-- Border Linear Gradient (Cyber Hairline) -->
    <linearGradient id="pm-border-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="40%" stop-color="#4f46e5" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Interlocking Ribbon Facet 1: Electric Indigo -->
    <linearGradient id="pm-ribbon-indigo" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- Interlocking Ribbon Facet 2: Hyper Cyan / Emerald -->
    <linearGradient id="pm-ribbon-cyan" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Quantum Core Emerald Glow -->
    <linearGradient id="pm-core-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- High-Definition Drop Shadows -->
    <filter id="pm-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020408" flood-opacity="0.65"/>
    </filter>
    <filter id="pm-glow-core" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#22d3ee" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="64" cy="64" r="58" fill="url(#pm-glow)"/>

  <!-- Main Cyber Shield Geometry -->
  <g filter="url(#pm-shadow)">
    <!-- Base Shield Silhouette -->
    <path d="M 64 12
             C 86 19, 106 24, 110 37
             C 112 65, 99 97, 64 116
             C 29 97, 16 65, 18 37
             C 22 24, 42 19, 64 12 Z"
          fill="url(#pm-shield-base)"
          stroke="url(#pm-border-grad)"
          stroke-width="2.2"
          stroke-linejoin="round"/>

    <!-- Left Facet (Indigo Monogram 'P' Stem & Arch) -->
    <path d="M 64 22
             C 47 27, 30 32, 27 42
             C 25 62, 36 88, 64 105
             L 64 74
             C 52 74, 43 65, 43 54
             C 43 42, 52 34, 64 34 Z"
          fill="url(#pm-ribbon-indigo)"
          opacity="0.95"/>

    <!-- Right Facet (Cyan Interlocking Pass Loop) -->
    <path d="M 64 22
             C 81 27, 98 32, 101 42
             C 103 62, 92 88, 64 105
             L 64 74
             C 76 74, 85 65, 85 54
             C 85 42, 76 34, 64 34 Z"
          fill="url(#pm-ribbon-cyan)"
          opacity="0.92"/>

    <!-- Cryptographic Pass Key Shackle / Gateway Arch -->
    <path d="M 50 44
             V 36
             C 50 28.27, 56.27 22, 64 22
             C 71.73 22, 78 28.27, 78 36
             V 44"
          fill="none"
          stroke="#f8fafc"
          stroke-width="5.5"
          stroke-linecap="round"/>

    <!-- Inner Keyhole / Ephemeral Token Aperture -->
    <g filter="url(#pm-glow-core)">
      <circle cx="64" cy="54" r="12" fill="#070a13" stroke="#ffffff" stroke-width="2.6"/>
      <path d="M 60.5 54 L 67.5 54 L 69.5 70 L 58.5 70 Z" fill="#ffffff"/>
      <!-- Active Quantum Emerald Node -->
      <circle cx="64" cy="54" r="5" fill="url(#pm-core-emerald)"/>
    </g>

    <!-- Precision Orbital Tech Marks -->
    <circle cx="64" cy="54" r="23" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="4 6" opacity="0.8"/>
    <circle cx="64" cy="54" r="30" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="2 8" opacity="0.5"/>
  </g>
</svg>